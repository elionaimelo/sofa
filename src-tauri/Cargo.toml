[package]
name = "sofa"
version = "0.3.19"
description = "Controller-first game library"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sofa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
reqwest = { version = "0.13", features = ["json", "query"] }
tokio = { version = "1", features = ["time"] }
tiny_http = "0.12"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
starship-battery = "0.12"
scraper = "0.27"
flate2 = "1"
sha1 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# Thin LTO parallelises whole-program optimisation: much faster CI builds for a slightly
# larger binary. (Fat LTO with codegen-units = 1 was the slowest step of every release.)
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
# Native HID access for the Ally OEM button (not exposed by XInput).
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Input_XboxController", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
winreg = "0.55"
# Typed COM/WinRT (volume, Bluetooth); already in the graph through Tauri.
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_Foundation", "Win32_System_WinRT", "Devices_Bluetooth", "Devices_Enumeration", "Foundation", "Foundation_Collections"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
