name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx biome ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Xbox Game Bar widget (widget/): UWP app signed with the same cert; the installer sideloads it.
      - uses: microsoft/setup-msbuild@v2
      - name: Build Game Bar widget
        env:
          IDENTITY_PFX_BASE64: ${{ secrets.IDENTITY_PFX_BASE64 }}
          IDENTITY_PFX_PASSWORD: ${{ secrets.IDENTITY_PFX_PASSWORD }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version + '.0'
          (Get-Content widget/Package.appxmanifest) -replace 'Version="0.0.0.0"', "Version=`"$ver`"" | Set-Content widget/Package.appxmanifest
          $pfx = "$env:RUNNER_TEMP/widget.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:IDENTITY_PFX_BASE64))
          msbuild widget/Sofa.Widget.csproj -t:restore -p:Configuration=Release -p:Platform=x64
          msbuild widget/Sofa.Widget.csproj -p:Configuration=Release -p:Platform=x64 -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile=$pfx -p:PackageCertificatePassword=$env:IDENTITY_PFX_PASSWORD -p:PackageCertificateThumbprint="" `
            -p:AppxPackageDir="$env:RUNNER_TEMP/widget-out/"
          Remove-Item $pfx
          $out = Get-ChildItem "$env:RUNNER_TEMP/widget-out" -Directory | Select-Object -First 1
          $dest = 'src-tauri/packaging/widget'
          New-Item "$dest/Dependencies" -ItemType Directory -Force | Out-Null
          Copy-Item "$($out.FullName)/*.msix" "$dest/Sofa.Widget.msix"
          Copy-Item "$($out.FullName)/Dependencies/x64/*.appx" "$dest/Dependencies"
      # Sparse MSIX that gives Sofa.exe a package identity (Xbox full screen experience home app).
      # Signed with the self-signed "CN=Sofa" cert; the installer trusts its public half.
      - name: Build identity package
        env:
          IDENTITY_PFX_BASE64: ${{ secrets.IDENTITY_PFX_BASE64 }}
          IDENTITY_PFX_PASSWORD: ${{ secrets.IDENTITY_PFX_PASSWORD }}
        run: |
          $bin = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makeappx.exe' | Sort-Object FullName | Select-Object -Last 1).DirectoryName
          $src = 'src-tauri/packaging'
          $stage = "$env:RUNNER_TEMP/identity"
          New-Item "$stage/Assets" -ItemType Directory -Force | Out-Null
          Copy-Item "$src/Assets/*" "$stage/Assets"
          Copy-Item "$src/CustomCapability.SCCD" $stage
          $ver = (Get-Content package.json | ConvertFrom-Json).version + '.0'
          (Get-Content "$src/AppxManifest.xml") -replace 'Version="0.0.0.0"', "Version=`"$ver`"" | Set-Content "$stage/AppxManifest.xml"
          & "$bin\makeappx.exe" pack /d $stage /p "$src/Sofa.Identity.msix" /nv /o
          $pfx = "$env:RUNNER_TEMP/identity.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:IDENTITY_PFX_BASE64))
          & "$bin\signtool.exe" sign /fd SHA256 /f $pfx /p $env:IDENTITY_PFX_PASSWORD "$src/Sofa.Identity.msix"
          Remove-Item $pfx
      # Create a draft before uploading; publish only after the build and assets are verified.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} 2>$null || gh release create ${{ github.ref_name }} --title "Sofa ${{ github.ref_name }}" --generate-notes --draft
      # Builds the NSIS installer, signs the updater artifact and publishes latest.json,
      # which the app polls at releases/latest/download/latest.json.
      - uses: tauri-apps/tauri-action@v1
        env:
          SOFA_PUBLISHER_CONFIG: ${{ vars.SOFA_PUBLISHER_CONFIG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sofa ${{ github.ref_name }}
          releaseBody: See the commits for changes.
          releaseDraft: true
